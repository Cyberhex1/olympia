name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A fresh clone has no olympia.config.json yet; start from the shared example like a new user would.
      - run: copy olympia.config.example.json olympia.config.json
        shell: cmd
      - run: npm test
