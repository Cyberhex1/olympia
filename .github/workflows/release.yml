name: release

# Push a version tag (git tag v1.0.0 && git push origin v1.0.0) to build the Windows installer and portable zip
# and attach them to a draft release. Review the draft on GitHub, then publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: copy olympia.config.example.json olympia.config.json
        shell: cmd
      - run: npm test
      - run: npx electron-builder --win --publish never
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Olympia ${GITHUB_REF_NAME#v}" --generate-notes \
            dist/*.exe dist/*.zip
